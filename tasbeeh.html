<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المسبحة الإلكترونية | صدقة جارية</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .tasbeeh-intro {
      text-align: center;
      max-width: 750px;
      margin: 0 auto 35px;
      color: #b9c5bd;
      line-height: 2.2;
    }

    .dhikr-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .dhikr-btn {
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #234235;
      background: #0d241c;
      color: #d6ded9;
      cursor: pointer;
      font-size: 16px;
    }

    .dhikr-btn.active,
    .dhikr-btn:hover {
      border-color: #d7b56d;
      color: #d7b56d;
    }

    .tasbeeh-box {
      max-width: 650px;
      margin: auto;
      text-align: center;
      background: linear-gradient(
        145deg,
        #102d23,
        #071812
      );
      border: 1px solid #234235;
      border-radius: 30px;
      padding: 40px 25px;
    }

    .current-dhikr {
      color: #d7b56d;
      font-family: "Traditional Arabic", serif;
      font-size: 34px;
      line-height: 2;
      margin-bottom: 25px;
    }

    .counter {
      font-size: 80px;
      color: #f6f0df;
      font-weight: bold;
      margin: 20px 0;
    }

    .count-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 5px solid #d7b56d;
      background: #0d241c;
      color: #d7b56d;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(215,181,109,.08);
      transition: .15s;
    }

    .count-btn:active {
      transform: scale(.94);
    }

    .reset-btn {
      margin-top: 25px;
      padding: 12px 28px;
      border-radius: 25px;
      border: 1px solid #234235;
      background: transparent;
      color: #b9c5bd;
      cursor: pointer;
    }

    .target {
      margin-top: 20px;
      color: #8fa39a;
    }

    .progress-container {
      height: 8px;
      background: #162d25;
      border-radius: 20px;
      margin: 25px auto;
      max-width: 450px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #d7b56d;
      transition: .2s;
    }

    .message {
      margin-top: 20px;
      color: #d7b56d;
      min-height: 25px;
    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    صدقة جارية
  </div>

  <nav>

    <a href="index.html">الرئيسية</a>
    <a href="quran.html">القرآن</a>
    <a href="hadith.html">الأحاديث</a>
    <a href="adhkar.html">الأذكار</a>
    <a href="quran-tafsir.html">التفسير</a>
    <a href="quran-stories.html">قصص القرآن</a>
    <a href="prayer.html">تعلم الصلاة</a>
    <a href="duas.html">الأدعية</a>
    <a href="tasbeeh.html">المسبحة</a>

  </nav>

</header>



<main class="container">


  <h1 class="page-title">
    📿 المسبحة الإلكترونية
  </h1>


  <p class="tasbeeh-intro">

    اختر الذكر الذي تريد قوله، ثم اضغط على المسبحة
    مع كل تسبيحة. يمكنك تصفير العداد والبدء من جديد.

  </p>



  <div class="dhikr-selector">

    <button class="dhikr-btn active"
            onclick="selectDhikr(0)">
      سبحان الله
    </button>

    <button class="dhikr-btn"
            onclick="selectDhikr(1)">
      الحمد لله
    </button>

    <button class="dhikr-btn"
            onclick="selectDhikr(2)">
      الله أكبر
    </button>

    <button class="dhikr-btn"
            onclick="selectDhikr(3)">
      أستغفر الله
    </button>

    <button class="dhikr-btn"
            onclick="selectDhikr(4)">
      لا إله إلا الله
    </button>

    <button class="dhikr-btn"
            onclick="selectDhikr(5)">
      الصلاة على النبي ﷺ
    </button>

  </div>



  <section class="tasbeeh-box">


    <div id="currentDhikr"
         class="current-dhikr">
      سبحان الله
    </div>


    <div id="counter"
         class="counter">
      0
    </div>


    <div class="progress-container">

      <div id="progress"
           class="progress">
      </div>

    </div>


    <button class="count-btn"
            onclick="countDhikr()">

      تسبيح

    </button>


    <div id="target"
         class="target">

      الهدف: 33

    </div>


    <div id="message"
         class="message">
    </div>


    <button class="reset-btn"
            onclick="resetCounter()">

      إعادة العداد

    </button>


  </section>


</main>



<footer>

  صدقة جارية عن روح المرحوم
  المهندس عصام أحمد عبدالعزيز

</footer>



<script>

  const adhkar = [

    "سبحان الله",

    "الحمد لله",

    "الله أكبر",

    "أستغفر الله",

    "لا إله إلا الله",

    "اللهم صل وسلم على نبينا محمد"

  ];


  let currentIndex = 0;

  let count = 0;

  const target = 33;



  function selectDhikr(index) {

    currentIndex = index;

    count = 0;


    document.getElementById("currentDhikr")
      .textContent = adhkar[index];


    updateCounter();


    document.querySelectorAll(".dhikr-btn")
      .forEach((button, i) => {

        button.classList.toggle(
          "active",
          i === index
        );

      });

  }



  function countDhikr() {

    count++;

    updateCounter();


    if (count === target) {

      document.getElementById("message")
        .textContent =
        "ما شاء الله، أتممت 33 مرة 🤍";

    }

  }



  function updateCounter() {

    document.getElementById("counter")
      .textContent = count;


    const percentage =
      Math.min(
        (count / target) * 100,
        100
      );


    document.getElementById("progress")
      .style.width =
      percentage + "%";


    document.getElementById("message")
      .textContent = "";

  }



  function resetCounter() {

    count = 0;

    updateCounter();

  }

</script>


</body>

</html>
