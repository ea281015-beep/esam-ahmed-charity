function showCategory(category, button) {

  const container =
    document.getElementById("adhkarContainer");

  container.innerHTML = "";


  document
    .querySelectorAll(".category-buttons button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");


  const list = adhkar[category];


  list.forEach((zekr, index) => {

    const card =
      document.createElement("div");

    card.className = "zekr-card";


    card.innerHTML = `

      <div class="zekr-number">
        الذكر رقم ${index + 1}
      </div>

      <div class="zekr-text">
        ${zekr.text}
      </div>

      <div class="counter">

        <button onclick="decrease(this)">
          −
        </button>

        <span class="count">
          ${zekr.count}
        </span>

        <button onclick="increase(this)">
          +
        </button>

        <button onclick="resetCounter(this, ${zekr.count})">
          إعادة
        </button>

      </div>

      <div class="source">
        ${zekr.source}
      </div>

    `;

    container.appendChild(card);

  });

}


function increase(button) {

  const counter =
    button.parentElement
      .querySelector(".count");

  let value =
    Number(counter.textContent);

  if (value > 0) {
    value--;
  }

  counter.textContent = value;

}


function decrease(button) {

  const counter =
    button.parentElement
      .querySelector(".count");

  let value =
    Number(counter.textContent);

  value++;

  counter.textContent = value;

}


function resetCounter(button, original) {

  const counter =
    button.parentElement
      .querySelector(".count");

  counter.textContent = original;

}
