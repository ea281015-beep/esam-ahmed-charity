function showCategory(category, button) {

  document
    .querySelectorAll(".category-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  const list =
    document.getElementById("adhkarList");

  list.innerHTML = "";


  if (!adhkar[category] ||
      adhkar[category].length === 0) {

    list.innerHTML = `
      <div class="empty">
        لا توجد أذكار مضافة لهذا القسم حاليًا.
      </div>
    `;

    return;

  }


  adhkar[category].forEach((item, index) => {

    const card =
      document.createElement("article");

    card.className = "dhikr-card";

    card.innerHTML = `

      <div class="dhikr-number">
        ${index + 1}
      </div>

      <div class="dhikr-text">
        ${item.text}
      </div>

      <div class="dhikr-info">

        <span class="badge">
          🔢 ${item.count}
        </span>

      </div>

      <div class="source">
        📚 ${item.source}
      </div>

      <div class="count-area">

        <button
          class="count-button"
          onclick="countDhikr(this)">

          ✓ سجل التكرار

        </button>

        <span class="count-number">
          0
        </span>

      </div>

    `;

    list.appendChild(card);

  });

}



function countDhikr(button) {

  const number =
    button.parentElement
      .querySelector(".count-number");

  number.textContent =
    Number(number.textContent) + 1;

}



showCategory(
  "morning",
  document.querySelector(".category-btn")
);
