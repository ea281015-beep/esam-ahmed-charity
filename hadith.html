<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الأحاديث النبوية | صدقة جارية</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .hadith-intro {
      max-width: 850px;
      margin: 0 auto 35px;
      text-align: center;
      color: #b9c5bd;
      line-height: 2.2;
    }

    .hadith-controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 30px;
    }

    .hadith-controls select,
    .hadith-controls input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      background: #0d241c;
      border: 1px solid #234235;
      color: #f6f0df;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    .hadith-controls button {
      padding: 15px 22px;
      border: 1px solid #d7b56d;
      background: #d7b56d;
      color: #071812;
      border-radius: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .book-btn {
      padding: 17px;
      background: #0d241c;
      color: #d6ded9;
      border: 1px solid #234235;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
    }

    .book-btn:hover,
    .book-btn.active {
      border-color: #d7b56d;
      color: #d7b56d;
    }

    .hadith-card {
      background: linear-gradient(
        145deg,
        #102d23,
        #081a13
      );

      border: 1px solid #234235;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 18px;
    }

    .hadith-number {
      color: #d7b56d;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .hadith-text {
      font-family: "Traditional Arabic", serif;
      font-size: 25px;
      line-height: 2.4;
      color: #f6f0df;
    }

    .hadith-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .badge {
      padding: 7px 12px;
      border-radius: 15px;
      background: rgba(215,181,109,.07);
      color: #d7b56d;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #d7b56d;
      padding: 40px;
    }

    .error {
      text-align: center;
      color: #d98b8b;
      padding: 30px;
      line-height: 2;
    }

    .hadith-count {
      color: #8fa39a;
      margin-bottom: 20px;
      text-align: center;
    }

    @media(max-width:700px) {

      .hadith-controls {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    صدقة جارية
  </div>

  <nav>

    <a href="index.html">الرئيسية</a>
    <a href="quran.html">القرآن</a>
    <a href="hadith.html">الأحاديث</a>
    <a href="adhkar.html">الأذكار</a>
    <a href="quran-tafsir.html">التفسير</a>
    <a href="quran-stories.html">قصص القرآن</a>
    <a href="prayer.html">تعلم الصلاة</a>
    <a href="duas.html">الأدعية</a>
    <a href="tasbeeh.html">المسبحة</a>

  </nav>

</header>



<main class="container">


  <h1 class="page-title">
    📜 الأحاديث النبوية
  </h1>


  <p class="hadith-intro">

    مكتبة للأحاديث النبوية، مرتبة حسب الكتب،
    مع إمكانية البحث والوصول إلى الحديث ورقمه ومصدره.

  </p>



  <div class="books" id="books">

    <button class="book-btn active"
            onclick="loadBook('bukhari', this)">
      صحيح البخاري
    </button>

    <button class="book-btn"
            onclick="loadBook('muslim', this)">
      صحيح مسلم
    </button>

    <button class="book-btn"
            onclick="loadBook('abudawud', this)">
      سنن أبي داود
    </button>

    <button class="book-btn"
            onclick="loadBook('tirmidhi', this)">
      جامع الترمذي
    </button>

    <button class="book-btn"
            onclick="loadBook('nasai', this)">
      سنن النسائي
    </button>

    <button class="book-btn"
            onclick="loadBook('ibnmajah', this)">
      سنن ابن ماجه
    </button>

  </div>



  <div class="hadith-controls">

    <select id="sectionSelect">

      <option value="">
        كل الأحاديث
      </option>

    </select>


    <input
      id="searchInput"
      type="search"
      placeholder="ابحث داخل الأحاديث..."
    >


    <button onclick="searchHadith()">
      بحث
    </button>

  </div>



  <div id="status"
       class="loading">

    جاري تحميل الأحاديث...

  </div>


  <div id="hadithList">
  </div>


</main>



<footer>

  صدقة جارية عن روح المرحوم
  المهندس عصام أحمد عبدالعزيز

</footer>



<script>


const API =
"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1";



let currentBook = "bukhari";

let currentData = [];

let currentSections = [];



const bookNames = {

  bukhari: "صحيح البخاري",

  muslim: "صحيح مسلم",

  abudawud: "سنن أبي داود",

  tirmidhi: "جامع الترمذي",

  nasai: "سنن النسائي",

  ibnmajah: "سنن ابن ماجه"

};



async function loadBook(book, button) {

  currentBook = book;


  document
    .querySelectorAll(".book-btn")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  if (button) {
    button.classList.add("active");
  }


  document.getElementById("status")
    .innerHTML =
    "جاري تحميل " +
    bookNames[book] +
    "...";


  document.getElementById("hadithList")
    .innerHTML = "";


  try {

    const url =
      `${API}/editions/ara-${book}.json`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    currentData =
      data.hadiths || [];


    currentSections =
      data.metadata?.sections || {};


    fillSections();


    renderHadiths(
      currentData.slice(0, 30)
    );


    document.getElementById("status")
      .innerHTML =
      `تم تحميل ${currentData.length} حديث من ${bookNames[book]}`;


  } catch (error) {

    console.error(error);


    document.getElementById("status")
      .innerHTML = `

        <div class="error">

          حدث خطأ أثناء تحميل الأحاديث.

          <br>

          تأكد من اتصال الإنترنت ثم حاول مرة أخرى.

        </div>

      `;

  }

}



function fillSections() {

  const select =
    document.getElementById("sectionSelect");


  select.innerHTML = `
    <option value="">
      كل الأحاديث
    </option>
  `;


  Object.entries(currentSections)
    .forEach(([key, value]) => {

      const option =
        document.createElement("option");


      option.value = key;


      option.textContent =
        value;


      select.appendChild(option);

    });

}



function renderHadiths(list) {

  const container =
    document.getElementById("hadithList");


  container.innerHTML = "";


  if (!list.length) {

    container.innerHTML = `

      <div class="loading">
        لا توجد نتائج.
      </div>

    `;

    return;

  }


  list.forEach(hadith => {

    const card =
      document.createElement("article");


    card.className =
      "hadith-card";


    const section =
      currentSections[
        hadith.chapterId
      ] || "";


    card.innerHTML = `

      <div class="hadith-number">

        حديث رقم:
        ${hadith.hadithnumber || ""}

      </div>


      <div class="hadith-text">

        ${hadith.text || ""}

      </div>


      <div class="hadith-info">

        <span class="badge">

          📚 ${bookNames[currentBook]}

        </span>


        ${
          section
          ?
          `<span class="badge">
            📖 ${section}
          </span>`
          :
          ""
        }

      </div>

    `;


    container.appendChild(card);

  });

}



function searchHadith() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const section =
    document
      .getElementById("sectionSelect")
      .value;


  let results =
    currentData;


  if (section) {

    results =
      results.filter(hadith =>
        String(hadith.chapterId) ===
        String(section)
      );

  }


  if (keyword) {

    results =
      results.filter(hadith =>
        (hadith.text || "")
          .toLowerCase()
          .includes(keyword)
      );

  }


  document.getElementById("status")
    .innerHTML =
    `نتائج البحث: ${results.length}`;


  renderHadiths(
    results.slice(0, 100)
  );

}



document
  .getElementById("sectionSelect")
  .addEventListener(
    "change",
    searchHadith
  );



document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchHadith();

      }

    }
  );



loadBook(
  "bukhari",
  document.querySelector(".book-btn")
);


</script>


</body>

</html>
